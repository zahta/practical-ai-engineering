
services:
  api:
    build: ./fastapi-basic
    container_name: fastapi-api
    ports:
      - "8000:8000"
    env_file:
      - ./fastapi-basic/.env
    depends_on:
      - ai-service

  ai-service:
    build: ./ai-service
    container_name: ai-service

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
    restart: unless-stopped

volumes:
  n8n_data: